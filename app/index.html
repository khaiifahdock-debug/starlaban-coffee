function filters(){return '<div class="categories" role="group" aria-label="'+(lang==='so'?'Qaybaha liiska':'Menu categories')+'">'+[['all',t('all')],['hot',t('hot')],['iced',t('iced')],['matcha',t('matcha')],['signature',t('signature')],['food',t('food')]].map(([id,txt])=>'<button type="button" class="'+(cat===id?'on':'')+'" aria-pressed="'+(cat===id)+'" data-cat="'+id+'">'+txt+'</button>').join('')+'</div>'}
function card(p){return '<article class="dish" style="--tone:'+p.tone+'"><div class="dish-art">'+art(p.id)+'</div><div class="dish-body"><div class="dish-head"><h3>'+label(p)+'</h3>'+(!p.mediumPrice?'<span class="price">'+money(p.price)+(p.sized?' · '+t('small'):'')+'</span>':'')+'</div><p>'+(lang==='so'?p.soDesc:p.desc)+'</p>'+sizeOptions(p)+(p.preview?'<small class="menu-note">'+t('preview')+'</small>':'')+'<button class="add" type="button" data-customize="'+p.id+'">'+t('customize')+'</button></div></article>'}
function renderMenu(){const featured=['latte','salted-caramel-matcha'].map(id=>ITEMS.find(p=>p.id===id));const found=ITEMS.filter(p=>(cat==='all'||p.cat===cat)&&(!query||(p.name+' '+p.so+' '+p.desc+' '+p.soDesc).toLowerCase().includes(query.toLowerCase())));return '<section class="hello"><div class="eyebrow">'+t('eyebrow')+'</div><h1>'+t('title')+'</h1><p>'+t('subtitle')+'</p><span class="sample-chip">'+t('saved')+'</span></section><div class="sectionline"><h2>'+t('featured')+'</h2><button type="button" id="browseAll">'+t('seeAll')+'</button></div><div class="featured">'+featured.map(p=>'<article class="feature"><div class="feature-copy"><span class="badge">'+(p.cat==='matcha'?(lang==='so'?'Ururinta Matcha':'Matcha collection'):(lang==='so'?'Qahwo la jecel yahay':'Coffee favorite'))+'</span><h3>'+label(p)+'</h3><p>'+(lang==='so'?p.soDesc:p.desc)+'</p>'+sizeOptions(p)+'<button class="price-add" data-customize="'+p.id+'" type="button">'+t('customize')+'</button></div><div class="feature-art">'+art(p.id)+'</div></article>').join('')+'</div><div class="sectionline"><h2>'+t('menu')+'</h2></div><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span class="sr">'+t('searchLabel')+'</span><input id="search" type="search" value="'+query.replaceAll('"','&quot;')+'" placeholder="'+t('search')+'" autocomplete="off"></label>'+filters()+'<div class="grid">'+(found.length?found.map(card).join(''):'<p class="empty">'+t('empty')+'</p>')+'</div>'}
function cartDetails(r){return [r.sugar?t(r.sugar==='regular'?'regularSugar':r.sugar==='none'?'noSugar':r.sugar==='less'?'lessSugar':'extraSugar'):'',r.ice?t(r.ice==='regular'?'regularIce':r.ice==='less'?'lessIce':'noIce'):''].filter(Boolean).join(' · ')}
function renderCart(){if(!count())return '<section class="hello"><div class="eyebrow">'+t('menu')+'</div><h1>'+t('cartEmpty')+'</h1><p>'+t('cartIntro')+'</p></section><article class="panel" style="text-align:center;padding:28px"><div style="font-size:46px;color:var(--saffron);font-family:Georgia">＋</div><p class="muted">'+t('cartIntro')+'</p><button class="primary" id="goBrowse">'+t('browse')+'</button></article>';const rows=cartRows();return '<section class="hello"><div class="eyebrow">'+t('current')+'</div><h1>'+t('cart')+'</h1><p>'+t('subtitle')+'</p></section><article class="panel"><h3>'+t('cart')+'</h3>'+rows.map(r=>'<div class="orderrow"><div><b>'+label(r.p)+(r.size?' · '+(r.size==='M'?t('medium'):t('small')):'')+'</b><small>'+cartDetails(r)+' · '+money(r.price)+' · '+money(r.price*r.qty)+'</small><button type="button" class="edit-item" data-edit="'+r.key+'">'+t('edit')+'</button></div><div class="qty"><button aria-label="'+t('remove')+' '+label(r.p)+'" data-qty="-" data-id="'+r.key+'">−</button><span>'+r.qty+'</span><button aria-label="Add another '+label(r.p)+'" data-qty="+" data-id="'+r.key+'">+</button></div></div>').join('')+'<div class="total"><span>'+t('subtotal')+'</span><span>'+money(total())+'</span></div></article><article class="panel pickup"><h3 style="grid-column:1/-1">'+t('pickup')+'</h3>'+[t('now'),t('later'),t('soon')].map((v,i)=>'<button type="button" class="'+(pickup===i?'on':'')+'" data-pickup="'+i+'">'+v+'</button>').join('')+'</article><article class="panel"><h3>'+t('payWith')+'</h3><p class="muted">'+t('paymentNote')+'</p><div class="pay-method">'+[['evc',t('evc')],['zaad',t('zaad')],['credit',t('credit')]].map(([id,name])=>'<button type="button" class="'+(payment===id?'on':'')+'" data-pay="'+id+'">'+name+(id==='credit'?' · '+money(credit):'')+'</button>').join('')+'</div><button class="primary" type="button" id="placeOrder">'+t('place')+' · '+money(total())+'</button></article>'}function renderWallet(){return '<section class="hello"><div class="eyebrow">'+t('wallet')+'</div><h1>'+t('walletTitle')+'</h1><p>'+t('walletNote')+'</p></section><article class="wallet"><span class="label">'+t('walletSub')+'</span><div class="balance">'+money(credit)+'</div><p>'+t('walletNote')+'</p></article><article class="panel"><h3>'+t('topup')+'</h3><p class="muted">'+t('paymentNote')+'</p><div class="quick-amounts">'+[[5,t('add5')],[10,t('add10')],[20,t('add20')]].map(([v,s])=>'<button data-topup="'+v+'" type="button">'+s+'</button>').join('')+'</div></article>'}
function renderRewards(){return '<section class="hello"><div class="eyebrow">'+t('rewards')+'</div><h1>'+t('starsTitle')+'</h1><p>'+t('starsSub')+'</p></section><article class="wallet"><span class="label">'+t('starsSub')+'</span><div class="balance">'+stars+' ★</div><p>50 '+t('starProgress')+'</p><div class="progress"><span style="width:'+Math.min(100,stars*2)+'%"></span></div></article><article class="panel"><h3>'+(lang==='so'?'Macmacaan bilaash ah':'A free donut is waiting')+'</h3><p class="muted">'+(lang==='so'?'Dalab kasta xidigo ayaa lagu kasbadaa. Tani waa tusaale keliya.':'Earn sample stars as you explore. Rewards in this preview are for demonstration only.')+'</p></article>'}
function renderOrders(){return '<section class="hello"><div class="eyebrow">'+t('orders')+'</div><h1>'+t('orderTitle')+'</h1><p>'+t('subtitle')+'</p></section>'+(lastOrder?'<article class="panel"><h3>'+t('orderLabel')+' #'+lastOrder.id+'</h3><p class="muted">'+lastOrder.items+'</p><p class="muted">'+lastOrder.time+' · '+money(lastOrder.total)+'</p><div class="progress"><span style="width:38%"></span></div><div class="status-step"><i>✓</i>'+t('orderReady')+'</div><div class="status-step dim"><i>2</i>'+t('orderWait')+'</div></article>':'<article class="panel"><h3>'+t('noOrders')+'</h3><p class="muted">'+t('noOrdersSub')+'</p><button class="primary" id="goBrowse">'+t('browse')+'</button></article>')}
function render(){renderNav();$('notice').textContent=t('notice');$('view').innerHTML=({menu:renderMenu,cart:renderCart,orders:renderOrders,wallet:renderWallet,rewards:renderRewards})[tab]();wire()}
function saveCredit(){try{localStorage.setItem('sl_redesign_credit',credit)}catch(e){}}
function wire(){$('view').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('view').querySelectorAll('[data-customize]').forEach(b=>b.onclick=()=>openCustomize(b.dataset.customize));$('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCustomize(b.dataset.edit.split('|')[0],b.dataset.edit));$('view').querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=(cart[id]||0)+(b.dataset.qty==='+'?1:-1);if(cart[id]<=0)delete cart[id];render()});$('view').querySelectorAll('[data-pickup]').forEach(b=>b.onclick=()=>{pickup=+b.dataset.pickup;render()});$('view').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;render()});$('view').querySelectorAll('[data-topup]').forEach(b=>b.onclick=()=>{credit+=+b.dataset.topup;saveCredit();showToast(t('topupDone'));render()});const q=$('search');if(q)q.oninput=()=>{query=q.value;const pos=$('view').scrollTop;render();$('view').scrollTop=pos;const nq=$('search');nq.focus();nq.setSelectionRange(query.length,query.length)};const all=$('browseAll');if(all)all.onclick=()=>{$('view').querySelector('.categories').scrollIntoView({block:'start',behavior:'smooth'})};const go=$('goBrowse');if(go)go.onclick=()=>{tab='menu';render()};const po=$('placeOrder');if(po)po.onclick=()=>{if(payment==='credit'&&credit<total()){showToast(lang==='so'?'Credit kugu filan ma jiro':'Not enough sample credit');return}if(payment==='credit')credit-=total();stars+=Math.floor(total());lastOrder={id:Date.now().toString().slice(-4),items:cartRows().map(r=>r.qty+' × '+label(r.p)+(r.size?' ('+(r.size==='M'?t('medium'):t('small'))+')':'')+(r.sugar&&r.sugar!=='regular'?' · '+t(r.sugar==='none'?'noSugar':r.sugar==='less'?'lessSugar':'extraSugar'):'')+(r.ice&&r.ice!=='regular'?' · '+t(r.ice==='less'?'lessIce':'noIce'):'')).join(', '),time:pickup===0?t('now'):pickup===1?t('later'):t('soon'),total:total()};cart={};tab='orders';saveCredit();render();showToast(t('success'))}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('customizeBackdrop').hidden)closeCustomize()});
function showToast(s){const m=$('message');m.textContent=s;m.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.classList.remove('show'),2100)}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>{const on=x.dataset.lang===lang;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});render()});
let saved=null;try{saved=Number(localStorage.getItem('sl_redesign_credit'))}catch(e){}if(Number.isFinite(saved)&&saved>=0)credit=saved;const params=new URLSearchParams(location.search),requested=params.get('item'),requestedSize=params.get('size');const requestedProduct=ITEMS.find(p=>p.id===requested);render();if(requestedProduct){openCustomize(requestedProduct.id);if(requestedProduct.mediumPrice&&['M','medium'].includes(requestedSize)){customizeState.size='M';renderCustomizeSheet()}}
</script><script>
(()=>{const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce||!('IntersectionObserver'in window))return;const selector="#view .hello > *, #view .sectionline, #view .feature, #view .dish";document.documentElement.classList.add('motion-enabled');const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target)}}),{threshold:.12,rootMargin:'0px 0px -20px 0px'});function scan(root){if(!root||!root.querySelectorAll)return;root.querySelectorAll(selector).forEach(el=>{if(el.classList.contains('reveal'))return;const group=el.closest('.grid,.featured,.hero-copy,.hello');if(group){const items=[...group.querySelectorAll('.dish,.feature,.reveal')].filter(x=>x!==el);el.style.setProperty('--reveal-delay',Math.min(items.length%4,3)*55+'ms')}el.classList.add('reveal');io.observe(el)})}scan(document);const target=document.querySelector("#view");if(target)new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1){if(node.matches&&node.matches(selector)){scan(node.parentElement)}else scan(node)}}))).observe(target,{childList:true,subtree:true})})();
</script></body></html>
