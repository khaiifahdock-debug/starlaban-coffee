.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:13px 0}.panel h3{font:700 19px var(--serif);color:var(--forest);margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.wallet{border:0;color:#fffdf8;background:var(--forest);padding:22px;border-radius:23px;position:relative;overflow:hidden}.wallet:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff2b;border-radius:50%;right:-68px;top:-95px;box-shadow:0 0 0 18px #ffffff08,0 0 0 38px #ffffff08}.wallet .label{font-size:11px;color:#d5dfd3}.wallet .balance{font:700 42px/1.1 var(--serif);margin:8px 0}.wallet p{font-size:11px;color:#cad7ca;margin:0}.quick-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-amounts button,.pickup button,.pay-method button{min-height:44px;background:var(--paper);border:1px solid #d9d2c4;border-radius:12px;color:var(--forest);font-size:12px;font-weight:700}.quick-amounts button:hover,.pickup button.on,.pay-method button.on{background:var(--sage);border-color:#8d9e88}.orderrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.orderrow:last-child{border:0}.orderrow b{font-size:13px;color:var(--forest)}.orderrow small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:36px;height:36px;border-radius:50%;border:1px solid #cfc7b8;background:var(--paper);color:var(--forest);font-size:18px}.qty span{min-width:16px;text-align:center;font-weight:700;font-size:12px}.total{border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;font-weight:800;color:var(--forest)}.pickup,.pay-method{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay-method{grid-template-columns:1fr}.pay-method button{text-align:left;padding:0 12px}.primary{width:100%;min-height:48px;border:0;border-radius:13px;background:var(--tomato);color:white; let lang='en',tab='menu',cat='all',query='',pickup=0,payment='evc',cart={},credit=10,stars=3,lastOrder=null,toastTimer;const $=id=>document.getElementById(id),t=k=>TXT[lang][k];

function card(p){return '<article class="dish" style="--tone:'+p.tone+'"><div class="dish-art">'+art(p.id)+'</div><div class="dish-body"><div class="dish-head"><h3>'+label(p)+'</h3><span class="price">'+money(p.price)+'</span></div><p>'+(lang==='so'?p.soDesc:p.desc)+'</p><button class="add" type="button" data-add="'+p.id+'"><span aria-hidden="true">+</span>'+t('add')+'</button></div></article>'}
function renderMenu(){const featured=['latte','sandwich'].map(id=>ITEMS.find(p=>p.id===id));const found=ITEMS.filter(p=>(cat==='all'||p.cat===cat)&&(!query||(p.name+' '+p.so+' '+p.desc+' '+p.soDesc).toLowerCase().includes(query.toLowerCase())));return '<section class="hello"><div class="eyebrow">'+t('eyebrow')+'</div><h1>'+t('title')+'</h1><p>'+t('subtitle')+'</p><span class="sample-chip">'+t('saved')+'</span></section><div class="sectionline"><h2>'+t('featured')+'</h2><button type="button" id="browseAll">'+t('seeAll')+'</button></div><div class="featured">'+featured.map(p=>'<article class="feature"><div class="feature-copy"><span class="badge">'+(p.id==='latte'?(lang==='so'?'Cabitaanka guriga':'House cup'):(lang==='so'?'Qado cusub':'Fresh lunch'))+'</span><h3>'+label(p)+'</h3><p>'+(lang==='so'?p.soDesc:p.desc)+'</p><button class="price-add" data-add="'+p.id+'" type="button">'+t('add')+' · '+money(p.price)+'</button></div><div class="feature-art">'+art(p.id)+'</div></article>').join('')+'</div><div class="sectionline"><h2>'+t('menu')+'</h2></div><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span class="sr">'+t('searchLabel')+'</span><input id="search" type="search" value="'+query.replaceAll('"','&quot;')+'" placeholder="'+t('search')+'" autocomplete="off"></label>'+filters()+'<div class="grid">'+(found.length?found.map(card).join(''):'<p class="empty">'+t('empty')+'</p>')+'</div>'}
function renderCart(){if(!count())return '<section class="hello"><div class="eyebrow">'+t('menu')+'</div><h1>'+t('cartEmpty')+'</h1><p>'+t('cartIntro')+'</p></section><article class="panel" style="text-align:center;padding:28px"><div style="font-size:46px;color:var(--saffron);font-family:Georgia">＋</div><p class="muted">'+t('cartIntro')+'</p><button class="primary" id="goBrowse">'+t('browse')+'</button></article>';const rows=ITEMS.filter(p=>cart[p.id]);return '<section class="hello"><div class="eyebrow">'+t('current')+'</div><h1>'+t('cart')+'</h1><p>'+t('subtitle')+'</p></section><article class="panel"><h3>'+t('cart')+'</h3>'+rows.map(p=>'<div class="orderrow"><div><b>'+label(p)+'</b><small>'+money(p.price)+' · '+money(p.price*cart[p.id])+'</small></div><div class="qty"><button aria-label="'+t('remove')+' '+label(p)+'" data-qty="-" data-id="'+p.id+'">−</button><span>'+cart[p.id]+'</span><button aria-label="Add another '+label(p)+'" data-qty="+" data-id="'+p.id+'">+</button></div></div>').join('')+'<div class="total"><span>'+t('subtotal')+'</span><span>'+money(total())+'</span></div></article><article class="panel pickup"><h3 style="grid-column:1/-1">'+t('pickup')+'</h3>'+[t('now'),t('later'),t('soon')].map((v,i)=>'<button type="button" class="'+(pickup===i?'on':'')+'" data-pickup="'+i+'">'+v+'</button>').join('')+'</article><article class="panel"><h3>'+t('payWith')+'</h3><p class="muted">'+t('paymentNote')+'</p><div class="pay-method">'+[['evc',t('evc')],['zaad',t('zaad')],['credit',t('credit')]].map(([id,name])=>'<button type="button" class="'+(payment===id?'on':'')+'" data-pay="'+id+'">'+name+(id==='credit'?' · '+money(credit):'')+'</button>').join('')+'</div><button class="primary" type="button" id="placeOrder">'+t('place')+' · '+money(total())+'</button></article>'}
function renderWallet(){return '<section class="hello"><div class="eyebrow">'+t('wallet')+'</div><h1>'+t('walletTitle')+'</h1><p>'+t('walletNote')+'</p></section><article class="wallet"><span class="label">'+t('walletSub')+'</span><div class="balance">'+money(credit)+'</div><p>'+t('walletNote')+'</p></article><article class="panel"><h3>'+t('topup')+'</h3><p class="muted">'+t('paymentNote')+'</p><div class="quick-amounts">'+[[5,t('add5')],[10,t('add10')],[20,t('add20')]].map(([v,s])=>'<button data-topup="'+v+'" type="button">'+s+'</button>').join('')+'</div></article>'}
function renderRewards(){return '<section class="hello"><div class="eyebrow">'+t('rewards')+'</div><h1>'+t('starsTitle')+'</h1><p>'+t('starsSub')+'</p></section><article class="wallet"><span class="label">'+t('starsSub')+'</span><div class="balance">'+stars+' ★</div><p>50 '+t('starProgress')+'</p><div class="progress"><span style="width:'+Math.min(100,stars*2)+'%"></span></div></article><article class="panel"><h3>'+(lang==='so'?'Macmacaan bilaash ah':'A free donut is waiting')+'</h3><p class="muted">'+(lang==='so'?'Dalab kasta xidigo ayaa lagu kasbadaa. Tani waa tusaale keliya.':'Earn sample stars as you explore. Rewards in this preview are for demonstration only.')+'</p></article>'}
function renderOrders(){return '<section class="hello"><div class="eyebrow">'+t('orders')+'</div><h1>'+t('orderTitle')+'</h1><p>'+t('subtitle')+'</p></section>'+(lastOrder?'<article class="panel"><h3>'+t('orderLabel')+' #'+lastOrder.id+'</h3><p class="muted">'+lastOrder.items+'</p><p class="muted">'+lastOrder.time+' · '+money(lastOrder.total)+'</p><div class="progress"><span style="width:38%"></span></div><div class="status-step"><i>✓</i>'+t('orderReady')+'</div><div class="status-step dim"><i>2</i>'+t('orderWait')+'</div></article>':'<article class="panel"><h3>'+t('noOrders')+'</h3><p class="muted">'+t('noOrdersSub')+'</p><button class="primary" id="goBrowse">'+t('browse')+'</button></article>')}
function render(){renderNav();$('notice').textContent=t('notice');$('view').innerHTML=({menu:renderMenu,cart:renderCart,orders:renderOrders,wallet:renderWallet,rewards:renderRewards})[tab]();wire()}
function saveCredit(){try{localStorage.setItem('sl_redesign_credit',credit)}catch(e){}}
function wire(){$('view').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('view').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('view').querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=(cart[id]||0)+(b.dataset.qty==='+'?1:-1);if(cart[id]<=0)delete cart[id];render()});$('view').querySelectorAll('[data-pickup]').forEach(b=>b.onclick=()=>{pickup=+b.dataset.pickup;render()});$('view').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;render()});$('view').querySelectorAll('[data-topup]').forEach(b=>b.onclick=()=>{credit+=+b.dataset.topup;saveCredit();showToast(t('topupDone'));render()});const q=$('search');if(q)q.oninput=()=>{query=q.value;const pos=$('view').scrollTop;render();$('view').scrollTop=pos;const nq=$('search');nq.focus();nq.setSelectionRange(query.length,query.length)};const all=$('browseAll');if(all)all.onclick=()=>{$('view').querySelector('.categories').scrollIntoView({block:'start',behavior:'smooth'})};const go=$('goBrowse');if(go)go.onclick=()=>{tab='menu';render()};const po=$('placeOrder');if(po)po.onclick=()=>{if(payment==='credit'&&credit<total()){showToast(lang==='so'?'Credit kugu filan ma jiro':'Not enough sample credit');return}if(payment==='credit')credit-=total();stars+=Math.floor(total());lastOrder={id:Date.now().toString().slice(-4),items:ITEMS.filter(p=>cart[p.id]).map(p=>cart[p.id]+' × '+label(p)).join(', '),time:pickup===0?t('now'):pickup===1?t('later'):t('soon'),total:total()};cart={};tab='orders';saveCredit();render();showToast(t('success'))}}
function showToast(s){const m=$('message');m.textContent=s;m.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.classList.remove('show'),2100)}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>{const on=x.dataset.lang===lang;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});render()});
let saved=null;try{saved=Number(localStorage.getItem('sl_redesign_credit'))}catch(e){}if(Number.isFinite(saved)&&saved>=0)credit=saved;const requested=new URLSearchParams(location.search).get('item');if(ITEMS.some(p=>p.id===requested))cart[requested]=1;render();
</script></body></html>
